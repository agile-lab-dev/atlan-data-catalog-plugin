openapi: 3.0.3
info:
  title: Atlan Data Catalog Plugin API
  description: |
    This is the OpenAPI specification of the **Atlan Data Catalog Plugin**, a Witboost Data Catalog Plugin
    that publishes Data Product metadata (DataProduct, Table/View, Column, Glossary Terms) into
    [Atlan](https://atlan.com) at the end of the provisioning phase.

    It is not meant to be called directly by users: it is invoked by the Witboost Control Plane at the end
    of the deploy flow, and receives the whole system descriptor already enriched with tech adapters' deploy info.

    See [technical-details.md](technical-details.md) and [HLD.md](HLD.md) for the full design.
  version: "{{version}}"
servers:
  - url: http://atlan-data-catalog-plugin.{namespace}:{port}
    description: Atlan Data Catalog Plugin
    variables:
      namespace:
        default: witboost
      port:
        default: "5002"
tags:
  - name: DataCatalogPlugin
    description: Operations specific to Data Catalog Plugins
paths:
  /v1/entity/reference:
    get:
      tags:
        - DataCatalogPlugin
      summary: Get linked Data Catalog entity
      description: |
        Return the reference (id, links, etc) to the Data Catalog entity that refers to the provided Output Port
      operationId: getEntityReference
      parameters:
        - name: componentId
          in: query
          description: Output Port URN to get the reference to the Data Catalog entity
          required: true
          schema:
            type: string
            example: urn:dmb:dp:finance:a-system:0:component:1
      responses:
        200:
          description: Data Catalog Entity reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityReference"
        500:
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemError"
  /v2/validate:
    post:
      tags:
        - TechAdapter
      summary: Validate a deployment request
      operationId: asyncValidate
      requestBody:
        description: A deployment request descriptor wrapped as a string into a simple object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequest'
        required: true

      response_model:
        content:
          application/json:
            schema:
              type: string

      responses:

        202:
          description: Returns the DAG id of the Provisioning Plan
          content:
            application/json:
              schema:
                type: string
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemError'
  /v2/validate/{token}/status:
    get:
      tags:
        - TechAdapter
      summary: Get the status for a provisioning request
      operationId: getValidationStatus
      parameters:
        - name: token
          in: path
          description: token that identifies the request
          required: true
          schema:
            type: string
      responses:
        200:
          description: The request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationStatus"
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemError"
  /v1/provision:
    post:
      tags:
        - TechAdapter
      summary: Deploy a data product or a single component starting from a provisioning descriptor
      operationId: provision
      requestBody:
        description: Provisioning descriptor
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisioningRequest"
        required: true
      responses:
        200:
          description: It synchronously returns the request result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningStatus"
        202:
          description: If successful returns a provisioning deployment task token that can be used for polling the request status
          content:
            application/json:
              schema:
                type: string
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemError"
  /v1/provision/{token}/status:
    get:
      tags:
        - TechAdapter
      summary: Get the status for a provisioning request
      operationId: getStatus
      parameters:
        - name: token
          in: path
          description: token that identifies the request
          required: true
          schema:
            type: string
      responses:
        200:
          description: The request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningStatus"
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemError"
  /v1/validate:
    post:
      tags:
        - TechAdapter
      summary: Validate a provisioning request
      operationId: validate
      requestBody:
        description: Provisioning descriptor to be validated
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisioningRequest"
        required: true
      responses:
        200:
          description: It synchronously returns a specific reply containing the validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemError"
  /v1/unprovision:
    post:
      tags:
        - TechAdapter
      summary: Undeploy a data product or a single component given the provisioning descriptor relative to the latest complete provisioning request
      operationId: unprovision
      requestBody:
        description: Provisioning descriptor
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisioningRequest"
        required: true
      responses:
        200:
          description: It synchronously returns the request result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningStatus"
        202:
          description: If successful returns a provisioning deployment task token that can be used for polling the request status
          content:
            application/json:
              schema:
                type: string
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemError"
  /v1/updateacl:
    post:
      tags:
        - TechAdapter
      summary: Request the access to a tech adapter component
      operationId: updateacl
      requestBody:
        description: An access request object. The provisoning info reported in `provisionInfo` refer to the latest complete provisioning workflow of the target component
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAclRequest"
        required: true
      responses:
        200:
          description: It synchronously returns the access request response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningStatus"
        202:
          description: If successful returns a provisioning deployment task token that can be used for polling the request status
          content:
            application/json:
              schema:
                type: string
        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        500:
          description: System problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemError"
components:
  schemas:
    ValidationStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [RUNNING, COMPLETED, FAILED]
        result:
          $ref: "#/components/schemas/ValidationResult"
    ValidationRequest:
      type: object
      required:
        - descriptor
      properties:
        descriptor:
          type: string
    UpdateAclRequest:
      required:
        - refs
        - provisionInfo
      type: object
      properties:
        refs:
          type: array
          description: Identities (i.e. users and groups) involved in the ACL update request
          example:
            [
              "user:alice",
              "user:bob",
              "group:groupA",
              "group:groupB",
              "group:groupC",
            ]
          items:
            type: string
        provisionInfo:
          $ref: "#/components/schemas/ProvisionInfo"
    DescriptorKind:
      type: string
      description: >
        Values:
         * `DATAPRODUCT_DESCRIPTOR` - Complete descriptor of a data product. It is used in the data product level provisioning workflow.
         * `COMPONENT_DESCRIPTOR` - Provisioning descriptor for a single data product component. Includes both the complete data product descriptor (`dataProduct` object field) and the id of the component to be provisioned (`componentIdToProvision` string field).
         * `DATAPRODUCT_DESCRIPTOR_WITH_RESULTS` - This value is not currently used in the scope of a tech adapter.
      enum:
        [
          DATAPRODUCT_DESCRIPTOR,
          COMPONENT_DESCRIPTOR,
          DATAPRODUCT_DESCRIPTOR_WITH_RESULTS,
        ]
    ProvisioningRequest:
      required:
        - descriptorKind
        - descriptor
      type: object
      properties:
        descriptorKind:
          $ref: "#/components/schemas/DescriptorKind"
        descriptor:
          type: string
          description: Descriptor specification in yaml format. Its structure changes according to `descriptorKind`.
    ProvisioningStatus:
      required:
        - status
        - result
      type: object
      properties:
        status:
          type: string
          enum: [RUNNING, COMPLETED, FAILED]
        result:
          deprecated: true
          type: string
        info:
          $ref: "#/components/schemas/Info"
    ValidationResult:
      required:
        - valid
      type: object
      properties:
        valid:
          type: boolean
        error:
          $ref: "#/components/schemas/ValidationError"
    ValidationError:
      required:
        - errors
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
    ProvisionInfo:
      required:
        - request
        - result
      type: object
      description: "Information related to the provisioning workflow of a data product component"
      properties:
        request:
          type: string
          description: "Provisioning descriptor of type `COMPONENT_DESCRIPTOR` (see [DescriptorKind](#/components/schemas/DescriptorKind) schema) in JSON format. It had been used to provision the data product component"
        result:
          type: string
          description: "Result message (e.g. a provisiong error or a success message returned by the tech adapter in the [ProvisioningStatus](#/components/schemas/ProvisioningStatus))"
    SystemError:
      required:
        - error
      type: object
      properties:
        error:
          type: string
    EntityReference:
      required:
        - reference
      type: object
      properties:
        reference:
          type: string
          description: Reference to the Data Catalog entity. Either an ID or a link to the entity in the Data Catalog.
    Info:
      type: object
      required:
        - publicInfo
        - privateInfo
      properties:
        publicInfo:
          type: object
          description: >
            Fields to display in the Marketplace UI.
            Note that only the values compliant to specific structures will be rendered in the "Technical Information" card of the Marketplace pages. [Check the documentation](https://docs.witboost.com/docs/apis/extension-points/market-plane/data-catalog-plugin-api) for additional details
        privateInfo:
          type: object
          description: "All the values in this object will be stored in the deployed descriptor, but will not be shown in the Marketplace UI"
